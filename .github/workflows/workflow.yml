name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A4D9CC: ${{ secrets.A4D9CC }}
          B8AFA8: ${{ secrets.B8AFA8 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A4D9CC', '')
          sec_b = os.environ.get('B8AFA8', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- c267d4e0747b39a1 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- a95da5f108e0b586ab0069338a8417aca8 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
